<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso de Direitos Humanos e Saúde Mental - Tutores</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
      background: #f7f8fa;
      color: #222;
    }
    .banner-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .banner-box img {
      display: block;
      width: 100%;
      height: auto;
    }
    .instrucao {
      margin: 0 0 14px 0;
      font-size: 15px;
      line-height: 1.5;
      color: #222;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 16px;
    }
    .busca-box {
      display: flex;
      gap: 10px;
    }
    input[type="email"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #2e6b3e;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #235330;
    }
    .meta {
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .trilha-item {
      border-top: 1px solid #eee;
      padding: 14px 0;
    }
    .trilha-titulo {
      font-weight: bold;
      color: #2e6b3e;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .pergunta-bloco {
      margin-bottom: 10px;
      padding-left: 10px;
      border-left: 3px solid #e2e8e4;
    }
    .pergunta-texto {
      font-weight: bold;
      font-size: 14px;
      color: #333;
      margin-bottom: 3px;
    }
    .resposta-texto {
      font-size: 14px;
      color: #222;
      line-height: 1.45;
    }
    .sem-resposta {
      color: #777;
      font-style: italic;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 8px;
      margin-bottom: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    #statusMsg {
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="banner-box">
    <img src="banner.jpg" alt="Educação em Direitos Humanos e Saúde Mental - UNIPAMPA">
  </div>

  <div class="card">
    <p class="instrucao">
      Insira seu e-mail cadastrado no Curso de Direitos Humanos e Saúde Mental, para ter acesso as suas respostas das Trilhas do curso.
    </p>
    <div class="busca-box">
      <input type="email" id="emailInput" placeholder="Digite seu e-mail cadastrado..." required onkeydown="if(event.key==='Enter') buscarEmail()">
      <button onclick="buscarEmail()">Consultar</button>
    </div>
    <div id="aviso" style="margin-top: 12px;"></div>
  </div>

  <div id="painelResultado" class="card" style="display: none;">
    <div id="dadosTutor" class="meta"></div>
    <h3>Respostas nas Trilhas</h3>
    <div id="listaTrilhas"></div>

    <div style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 16px;">
      <label for="campoMensagem"><strong>Adicionar nova observação ou mensagem:</strong></label>
      <textarea id="campoMensagem" rows="4" placeholder="Digite aqui caso queira registrar algo..."></textarea>
      <button onclick="salvarMensagem()">Salvar mensagem</button>
      <div id="statusMsg"></div>
    </div>
  </div>

  <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbz2-VBxIK8DTS1SbuRjyAstLjiEU78hKujSVbtTcKclz0gTim-5fjQ84o5U8tcQ0YgRZQ/exec';

    function formatarValorResposta(resposta, pergunta = '') {
      const textoOriginal = String(resposta ?? '').trim();
      if (!textoOriginal) return '';

      const ehPerguntaPorcentagem = /porcentagem|percentual|%/i.test(pergunta);
      if (!ehPerguntaPorcentagem) return textoOriginal;

      if (textoOriginal.endsWith('%')) {
        return textoOriginal.replace(/\s+/g, '');
      }

      const normalizado = textoOriginal.replace(',', '.');
      const numero = Number(normalizado);

      if (!Number.isNaN(numero)) {
        const percentual = numero >= 0 && numero <= 1 ? numero * 100 : numero;
        const arredondado = Math.round(percentual * 100) / 100;
        return `${arredondado}%`;
      }

      return textoOriginal;
    }

    async function buscarEmail() {
      const email = document.getElementById('emailInput').value.trim();
      const aviso = document.getElementById('aviso');
      const painel = document.getElementById('painelResultado');

      if (!email) {
        aviso.innerHTML = '<span style="color:#b00020;">Informe um e-mail para buscar.</span>';
        return;
      }

      aviso.textContent = 'Buscando na planilha...';
      painel.style.display = 'none';
      document.getElementById('statusMsg').textContent = '';

      try {
        const resp = await fetch(`${URL_SCRIPT}?email=${encodeURIComponent(email)}`);
        const data = await resp.json();

        let tutorEncontrado = null;

        if (data && data.encontrado) {
          tutorEncontrado = data;
        } else if (data && Array.isArray(data.tutores)) {
          const alvo = email.toLowerCase();
          tutorEncontrado = data.tutores.find(t => {
            const emails = (t.email || '').toLowerCase().split(/[\/,;]+/).map(s => s.trim());
            return emails.includes(alvo);
          });
          if (tutorEncontrado) {
            tutorEncontrado.encontrado = true;
          }
        }

        if (!tutorEncontrado || !tutorEncontrado.encontrado) {
          aviso.innerHTML = '<span style="color:#b00020;">E-mail não encontrado no cadastro de tutores.</span>';
          return;
        }

        aviso.textContent = '';
        painel.style.display = 'block';

        const nomeTutor = tutorEncontrado.nome || tutorEncontrado.tutor || '';
        const grupoTutor = tutorEncontrado.grupo || '';

        document.getElementById('dadosTutor').innerHTML = `
          <div><strong>Tutor(a):</strong> ${escaparHtml(nomeTutor)}</div>
          ${grupoTutor ? `<div><strong>Grupo / UF:</strong> ${escaparHtml(grupoTutor)}</div>` : ''}
        `;

        const ordem = ['Trilha 1', 'Trilha 2', 'Trilha 3', 'Trilha 4', 'Trilha 5'];
        const trilhasObj = tutorEncontrado.trilhas || {};

        const listaTrilhas = document.getElementById('listaTrilhas');
        listaTrilhas.innerHTML = ordem.map(nomeTrilha => {
          const dadosTrilha = trilhasObj[nomeTrilha];
          const itens = (dadosTrilha && Array.isArray(dadosTrilha.itens)) ? dadosTrilha.itens : [];

          if (itens.length === 0) {
            return `
              <div class="trilha-item">
                <div class="trilha-titulo">${escaparHtml(nomeTrilha)}</div>
                <div class="sem-resposta">Sem resposta registrada</div>
              </div>
            `;
          }

          const perguntasHtml = itens.map((q, i) => {
            const valorFormatado = formatarValorResposta(q.resposta, q.pergunta);
            return `
              <div class="pergunta-bloco">
                <div class="pergunta-texto">${i + 1}. ${escaparHtml(q.pergunta)}</div>
                <div class="resposta-texto">${escaparHtml(valorFormatado).replace(/\n/g, '<br>')}</div>
              </div>
            `;
          }).join('');

          return `
            <div class="trilha-item">
              <div class="trilha-titulo">${escaparHtml(nomeTrilha)}</div>
              <div>${perguntasHtml}</div>
            </div>
          `;
        }).join('');

        document.getElementById('campoMensagem').value = '';
      } catch (err) {
        console.error(err);
        aviso.innerHTML = '<span style="color:#b00020;">Erro ao consultar os dados.</span>';
      }
    }

    async function salvarMensagem() {
      const email = document.getElementById('emailInput').value.trim();
      const campo = document.getElementById('campoMensagem');
      const mensagem = campo.value.trim();
      const statusMsg = document.getElementById('statusMsg');

      if (!mensagem) {
        statusMsg.style.color = '#b00020';
        statusMsg.textContent = 'Digite uma mensagem antes de salvar.';
        return;
      }

      statusMsg.style.color = '#333';
      statusMsg.textContent = 'Salvando...';

      try {
        const resp = await fetch(URL_SCRIPT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ email, mensagem })
        });
        const data = await resp.json();

        if (data.sucesso) {
          campo.value = '';
          statusMsg.style.color = '#2e6b3e';
          statusMsg.textContent = 'Mensagem salva';
        } else {
          statusMsg.style.color = '#b00020';
          statusMsg.textContent = `Não foi possível salvar (${data.motivo || 'falha_desconhecida'}).`;
        }
      } catch (err) {
        console.error(err);
        statusMsg.style.color = '#b00020';
        statusMsg.textContent = 'Erro de conexão ao salvar. Verifique a implantação do Apps Script.';
      }
    }

    function escaparHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
